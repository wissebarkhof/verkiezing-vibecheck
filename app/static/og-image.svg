<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="title" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="80%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.12"/>
      <stop offset="60%" stop-color="#2dd4bf" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#ffffff"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Top gradient bar -->
  <rect width="1200" height="6" fill="url(#bar)"/>

  <!-- Large decorative ballot icon (right side, very subtle) -->
  <g transform="translate(860, 145) scale(9)" opacity="0.09">
    <!-- Ballot paper -->
    <rect x="8" y="7" width="16" height="18" rx="2" fill="none" stroke="#6c63ff" stroke-width="1.5"/>
    <!-- Lines -->
    <rect x="11" y="11" width="10" height="1.5" rx="0.75" fill="#6c63ff"/>
    <rect x="11" y="14.5" width="7" height="1.5" rx="0.75" fill="#6c63ff"/>
    <!-- Checkmark -->
    <polyline points="10,19.5 13.5,23 22,14" fill="none" stroke="#6c63ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Main title: "Verkiezing" -->
  <text
    x="96"
    y="270"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="96"
    font-weight="700"
    letter-spacing="-3"
    fill="#111827">Verkiezing</text>

  <!-- Main title: "Vibecheck" with gradient -->
  <text
    x="96"
    y="376"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="96"
    font-weight="700"
    letter-spacing="-3"
    fill="url(#title)">Vibecheck</text>

  <!-- Tagline -->
  <text
    x="100"
    y="440"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="26"
    fill="#6b7280">AI-gestuurde analyse van verkiezingsprogramma's</text>

  <!-- Election info -->
  <text
    x="100"
    y="486"
    font-family="Inter, -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
    font-size="20"
    fill="#9ca3af">Gemeenteraadsverkiezingen Amsterdam · 18 maart 2026</text>

  <!-- Feature pills -->
  <!-- Partijen -->
  <rect x="100" y="524" width="148" height="38" rx="19" fill="rgba(160,245,233,0.35)"/>
  <text x="174" y="548" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#134e4a" text-anchor="middle">Partijvergelijking</text>

  <!-- Zoeken -->
  <rect x="260" y="524" width="118" height="38" rx="19" fill="rgba(157,220,242,0.4)"/>
  <text x="319" y="548" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#0c4a6e" text-anchor="middle">RAG-zoeken</text>

  <!-- Moties -->
  <rect x="390" y="524" width="98" height="38" rx="19" fill="rgba(166,160,245,0.35)"/>
  <text x="439" y="548" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#312e81" text-anchor="middle">Moties</text>

  <!-- Kandidaten -->
  <rect x="500" y="524" width="126" height="38" rx="19" fill="rgba(153,240,159,0.35)"/>
  <text x="563" y="548" font-family="Inter, -apple-system, Helvetica, Arial, sans-serif" font-size="15" font-weight="500" fill="#14532d" text-anchor="middle">Kandidaten</text>
</svg>
