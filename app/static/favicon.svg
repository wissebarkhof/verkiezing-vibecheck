<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a6a0f5"/>
      <stop offset="100%" stop-color="#a0f5e9"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>
  <!-- Ballot paper (white card) -->
  <rect x="8" y="7" width="16" height="18" rx="2" fill="white" opacity="0.95"/>
  <!-- Lines on ballot -->
  <rect x="11" y="11" width="10" height="1.5" rx="0.75" fill="#c4bef8"/>
  <rect x="11" y="14.5" width="7" height="1.5" rx="0.75" fill="#c4bef8"/>
  <!-- Checkmark -->
  <polyline points="10,19.5 13.5,23 22,14" fill="none" stroke="#6c63ff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
